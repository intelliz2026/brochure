<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INTELLIZ 브로슈어</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--fg:#151515;--sub:#6b6b66;--line:#e2e1dc;--accent:#151515}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1d1d1c;--fg:#f0f0ee;--sub:#a3a39d;--line:#2e2e2c;--accent:#f0f0ee}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{height:22px}
.langs{position:relative}
.langs>button{display:flex;align-items:center;gap:6px;font:inherit;font-size:13px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer}
.langs svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.menu button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;padding:9px 12px;border:0;border-radius:7px;background:none;color:var(--fg);cursor:pointer}
.menu button:hover{background:var(--bg)}
.menu button[aria-current=true]{font-weight:700}
.pw{position:relative;margin:0 auto}
.nav{display:none}
@media (hover:hover) and (pointer:fine){
.nav{display:flex;align-items:center;justify-content:center;position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:24px;cursor:pointer;z-index:1;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nav.prev{left:8px}.nav.next{right:8px}
.nav:disabled{opacity:.3;cursor:default}}
h1{font-size:13px;font-weight:500;color:var(--sub);margin-top:6px}
main{padding:16px;max-width:1100px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;padding:0}
.card img{display:block;flex:none;width:100%;aspect-ratio:210/297;object-fit:cover;background:var(--line)}
.card .t{min-width:0;padding:10px 11px 14px}
.card h2{font-size:15px;font-weight:700;line-height:1.3}
.card h2 small{display:block;font-size:11px;font-weight:600;color:#0070d2;margin:2px 0 0;white-space:normal}
.card .r{font-size:11px;color:var(--sub);margin-top:1px}
.card p{font-size:12.5px;line-height:1.5;color:var(--fg);margin-top:6px}
@media (min-width:700px){
.grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card h2{font-size:17px}.card h2 small{display:inline;font-size:12px;margin-left:6px}
.card .t{padding:14px 16px 18px}.card p{font-size:14px;margin-top:8px}}
.empty{color:var(--sub);text-align:center;padding:48px 0}
#viewer .bar{display:flex;align-items:center;gap:10px}
#viewer .bar a{color:inherit;text-decoration:none;font-size:22px;line-height:1;padding:0 4px}
#viewer .bar b{font-size:15px;font-weight:500;flex:1}
#count{font-size:13px;color:var(--sub)}
.pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:16px;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.pages img{flex:0 0 100%;max-width:100%;max-height:calc(100dvh - 150px);object-fit:contain;scroll-snap-align:center;background:var(--card);border-radius:6px}
@media (min-width:900px){.pw{padding:0 16px}.pages{padding-inline:0}.pages img{flex:none;width:auto;height:calc(100dvh - 190px);aspect-ratio:210/297}}
.actions{display:flex;gap:8px;padding:0 16px 24px;max-width:600px;margin:0 auto}
.actions a{flex:1;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--line);color:inherit;text-decoration:none;font-size:14px;background:var(--card)}
.actions a#ask{background:#0070d2;border-color:#0070d2;color:#fff;font-weight:600}
.actions a.main{background:var(--accent);color:var(--bg);border-color:var(--accent)}
footer{color:var(--sub);font-size:12px;text-align:center;padding:24px 16px 40px}
footer a{color:inherit}
footer .cta{display:inline-block;padding:11px 28px;border-radius:99px;background:#0070d2;color:#fff;font-size:14px;font-weight:600;text-decoration:none;margin-bottom:14px}
footer .links{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px}
[hidden]{display:none!important}

/* ===== 움직임·반응 ===== */
:root{--blue:#0070d2}
header{transition:box-shadow .2s}
header.stuck{box-shadow:0 2px 12px rgba(0,0,0,.18)}
.card{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;animation:rise .45s ease both;animation-delay:calc(var(--i,0)*45ms);-webkit-tap-highlight-color:transparent}
.card img{transition:transform .35s ease,opacity .3s ease;opacity:0}
.card img.on{opacity:1}
.card h2{transition:color .2s}
.card:active{transform:scale(.98)}
.card:focus-visible,.langs>button:focus-visible,.nav:focus-visible,.actions a:focus-visible,footer .cta:focus-visible,.menu button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (hover:hover){
.card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,.22);border-color:var(--blue)}
.card:hover img{transform:scale(1.03)}
.card:hover h2{color:var(--blue)}
.langs>button:hover{border-color:var(--blue);color:var(--blue)}
.actions a:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
footer .cta:hover{filter:brightness(1.12);transform:translateY(-1px)}
.nav:not(:disabled):hover{background:var(--blue);color:#fff;border-color:var(--blue)}
#viewer .bar a:hover{color:var(--blue)}}
@media (min-width:700px){.card img{transition:transform .35s ease,opacity .3s ease}.card{overflow:hidden}}
.actions a,footer .cta,.nav,.langs>button{transition:transform .15s,box-shadow .15s,filter .15s,background .15s,border-color .15s,color .15s}
.actions a:active,footer .cta:active{transform:scale(.97)}
.menu{transform-origin:top right;animation:pop .15s ease}
.menu button{transition:background .12s}
.pages img{animation:fade .3s ease both}
#bar{height:3px;background:var(--line);margin:0 16px;border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .25s ease}
#viewer:not([hidden]),#list:not([hidden]){animation:fade .25s ease}
#top{position:fixed;right:16px;bottom:20px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s;z-index:3}
#top.show{opacity:1;pointer-events:auto;transform:none}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.card img{opacity:1}}
.card img{opacity:1;background:linear-gradient(90deg,var(--line) 25%,var(--bg) 50%,var(--line) 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}
.card img.on{animation:none;background:var(--line)}
@keyframes shim{to{background-position:-200% 0}}
.actions button{flex:1;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--line);color:inherit;font:inherit;font-size:14px;background:var(--card);cursor:pointer}
@media (hover:hover){.actions button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.2)}}
.actions button:active{transform:scale(.97)}
#off{position:fixed;top:0;left:0;right:0;z-index:20;background:#b3261e;color:#fff;text-align:center;font-size:13px;padding:8px 12px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#14161a;color:#fff;padding:10px 16px;border-radius:99px;font-size:13.5px;opacity:0;transition:.2s;z-index:30;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:899px){
#viewer:not([hidden]){display:flex;flex-direction:column;min-height:100dvh}
#viewer .pw{flex:1;display:flex;align-items:center}
#viewer .pages{width:100%}
.actions{max-width:none;width:100%;margin:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}}
@media (hover:hover) and (pointer:fine){
.nav{width:48px;height:48px;border:0;border-radius:50%;background:none;box-shadow:none;color:var(--fg);opacity:.55;top:50%;transform:translateY(-50%)}
.nav svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nav.prev{left:-60px}.nav.next{right:-60px}
.nav:not(:disabled):hover{background:var(--card);color:var(--fg);border:0;opacity:1;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.nav:disabled{opacity:.15}}
html[lang=ko] .card p{word-break:keep-all;overflow-wrap:break-word}
</style>
</head>
<body>
<header>
  <div class="top">
    <svg class="logo" role="img" aria-label="INTELLIZ" fill="currentColor" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 230.7 43.4"> <polygon points="74.1 33.3 64.9 10.1 55.4 10.1 55.4 38.6 60.6 38.6 60.6 15.4 62.2 15.4 71.1 38.6 80.9 38.6 80.9 10.1 75.6 10.1 75.6 33.3 74.1 33.3"/> <polygon points="96 14.8 96 38.6 101.2 38.6 101.2 14.8 110.4 14.8 110.4 10.1 86.8 10.1 86.8 14.8 96 14.8"/> <rect x="43.1" y="10.1" width="5.3" height="28.4"/> <polygon points="153.5 33.9 153.5 33.9 153.5 10.1 148.3 10.1 148.3 38.6 167.9 38.6 167.9 33.9 153.5 33.9"/> <polygon points="178 33.9 178 33.9 178 10.1 172.7 10.1 172.7 38.6 192.3 38.6 192.3 33.9 178 33.9"/> <rect x="197.1" y="10.1" width="5.3" height="28.4"/> <polygon points="116.6 10.1 116.3 10.7 119.4 14.6 119.7 14.8 137.7 14.8 138 14.6 141.1 10.7 140.9 10.1 116.6 10.1"/> <polygon points="116.6 22 116.3 22.6 119.4 26.5 119.7 26.7 137.7 26.7 138 26.5 141.1 22.6 140.9 22 116.6 22"/> <polygon points="116.6 33.9 116.3 34.5 119.4 38.4 119.7 38.6 137.7 38.6 138 38.4 141.1 34.5 140.9 33.9 116.6 33.9"/> <polygon points="213.7 32.9 213.7 33.9 230.7 33.9 230.7 38.6 207.6 38.6 207.6 32.2 224.6 15.8 224.6 14.8 208 14.8 208 10.1 230.3 10.1 230.3 16.5 213.7 32.9"/> <polygon fill="#0070d2" points="24.9 9.7 15.3 2.7 14.4 3.2 14.4 9.7 20.3 14 20.6 14.5 20.6 36.4 24.2 39.1 25.2 38.6 25.2 10.1 24.9 9.7"/> <polygon fill="#0070d2" points="14.4 31.6 14.4 9.7 .9 0 0 .5 0 28.9 .2 29.4 19.6 43.4 20.6 42.9 20.6 36.4 14.6 32.1 14.4 31.6"/> </svg>
    <div class="langs" id="langs">
      <button id="langBtn" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c3 3 3 16 0 19M12 2.5c-3 3-3 16 0 19"/></svg><span id="langName"></span></button>
      <div class="menu" id="menu" hidden>
        <button data-l="ko">한국어</button><button data-l="en">English</button><button data-l="ja">日本語</button>
      </div>
    </div>
  </div>
  <h1 id="heading"></h1>
</header>

<main id="list"><div class="grid" id="grid"></div><p class="empty" id="empty" hidden></p></main>

<section id="viewer" hidden>
  <div style="padding:12px 16px 0" class="bar"><a href="#" aria-label="목록으로">‹</a><b id="vtitle"></b><span id="count"></span></div>
  <div id="bar"><i></i></div>
  <div class="pw">
    <button class="nav prev" id="prev" aria-label="이전"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
    <div class="pages" id="pages"></div>
    <button class="nav next" id="next" aria-label="다음"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>
  </div>
  <div class="actions"><a class="main" id="dl" download>PDF</a><button id="share" type="button"></button><a id="ask"></a></div>
</section>

<div id="off" role="status" hidden></div>
<div id="toast" role="status"></div>
<footer id="foot"></footer>
<button id="top" aria-label="맨 위로">↑</button>

<script src="brochures.js"></script>
<script>
// ===== 여기만 고치면 됨: 연락처 (자리표시 값 — 실제 정보로 바꿔 주세요) =====
const CONTACT = { tel: "+82-70-7006-8916", telText: "070-7006-8916", mail: "sales@intelliz.net", web: "https://intelliz.net" };
const contactUrl = l => CONTACT.web + (l === "ko" ? "" : "/" + l) + "/company/contact";
// =========================================================================
const T = {
  ko: { head: "제품 브로슈어", pdf: "PDF 받기", ask: "문의하기", empty: "준비 중입니다." , share: "공유하기", copied: "링크를 복사했어요", offline: "인터넷 연결이 끊겼어요. 연결되면 자동으로 이어져요" },
  en: { head: "Product brochures", pdf: "Download PDF", ask: "Contact us", empty: "Coming soon." , share: "Share", copied: "Link copied", offline: "You're offline. It will resume when you reconnect" },
  ja: { head: "製品パンフレット", pdf: "PDFダウンロード", ask: "お問い合わせ", empty: "準備中です。" , share: "共有", copied: "リンクをコピーしました", offline: "オフラインです。接続すると再開します" },
};
const ALL = window.BROCHURES || [];
const $ = id => document.getElementById(id);
const saved = (() => { try { return localStorage.getItem("lang"); } catch { return null; } })();
let lang = saved || ({ ko: "ko", ja: "ja" }[navigator.language.slice(0, 2)] || "en");

function setLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch {}
  document.documentElement.lang = l;
  for (const b of $("menu").children) b.toggleAttribute("aria-current", b.dataset.l === l);
  $("langName").textContent = { ko: "한국어", en: "English", ja: "日本語" }[l];
  $("menu").hidden = true; $("langBtn").setAttribute("aria-expanded", "false");
  foot(); route();
}

function showList() {
  const items = ALL.filter(i => i.lang === lang && i.pages);
  $("heading").textContent = `${T[lang].head} · ${items.length}`;
  $("grid").innerHTML = items.map((i, n) =>
    `<a class="card" style="--i:${n}" href="#/${i.id}/${i.lang}"><img decoding="async" onload="this.classList.add('on')" src="b/${i.id}/${i.lang}/cover.webp" alt=""><div class="t"><h2>${i.title}${i.sub ? `<small>${i.sub}</small>` : ""}</h2>${i.read ? `<div class="r">${i.read}</div>` : ""}<p>${i.desc || ""}</p></div></a>`).join("");
  $("empty").textContent = T[lang].empty;
  $("empty").hidden = items.length > 0;
}

function showViewer(id, l) {
  const i = ALL.find(x => x.id === id && x.lang === l && x.pages);
  if (!i) { location.hash = ""; return; }
  $("vtitle").textContent = i.title + (i.sub ? " · " + i.sub : "");
  const dir = `b/${i.id}/${i.lang}/`;
  $("pages").innerHTML = Array.from({ length: i.pages }, (_, n) =>
    `<img decoding="async" ${n > 1 ? 'fetchpriority="low"' : ""} src="${dir}p${String(n + 1).padStart(2, "0")}.webp" alt="${i.title} ${n + 1}">`).join("");
  $("pages").scrollLeft = 0;
  $("count").textContent = `1 / ${i.pages}`;
  requestAnimationFrame(() => { fit(); sync(); });
  $("dl").hidden = !i.pdf;
  if (i.pdf) { $("dl").href = i.pdf; $("dl").textContent = T[lang].pdf; }
  $("share").textContent = T[lang].share;
  $("ask").href = contactUrl(lang); $("ask").textContent = T[lang].ask;
  scrollTo(0, 0);
}

function sync() {
  const el = $("pages"), n = el.children.length;
  if (!n) return;
  const w = el.children[0].getBoundingClientRect().width + 12;
  $("count").textContent = `${Math.min(n, Math.round(el.scrollLeft / w) + 1)} / ${n}`;
  $("bar").firstElementChild.style.width = (Math.min(n, Math.round(el.scrollLeft / w) + 1) / n * 100) + "%";
  $("prev").disabled = el.scrollLeft < 5;
  $("next").disabled = el.scrollLeft + el.clientWidth >= el.scrollWidth - 5;
}
$("pages").addEventListener("scroll", sync, { passive: true });
function fit() {   // 데스크탑: 한 쪽씩, 가운데에 꽉 차게
  const el = $("pages"), pw = el.parentElement, img = el.children[0];
  pw.style.maxWidth = "";
  if (!img || !matchMedia("(min-width:900px)").matches) return;
  pw.style.maxWidth = (img.getBoundingClientRect().width + 32) + "px";
}
function step(dir) {
  const el = $("pages");
  el.scrollBy({ left: dir * (el.children[0].getBoundingClientRect().width + 12), behavior: "smooth" });
}
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
addEventListener("resize", () => { fit(); sync(); });
addEventListener("keydown", e => {
  if ($("viewer").hidden) return;
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === "ArrowRight") $("next").click();
});
addEventListener("scroll", () => {
  document.querySelector("header").classList.toggle("stuck", scrollY > 4);
  $("top").classList.toggle("show", scrollY > 500 && $("viewer").hidden);
}, { passive: true });
$("top").onclick = () => scrollTo({ top: 0 });
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("menu").hidden) $("menu").hidden = true;
  else if (!$("viewer").hidden) location.hash = "";
});
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 1800); }
$("share").onclick = async () => {
  const title = $("vtitle").textContent;
  if (navigator.share) { try { await navigator.share({ title, url: location.href }); } catch {} return; }
  try { await navigator.clipboard.writeText(location.href); }
  catch { const t = document.createElement("textarea"); t.value = location.href; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  toast(T[lang].copied);
};
function net() { const o = $("off"); o.hidden = navigator.onLine; o.textContent = T[lang].offline; }
addEventListener("online", net); addEventListener("offline", net);
$("langBtn").onclick = e => { e.stopPropagation(); const o = $("menu").hidden; $("menu").hidden = !o; $("langBtn").setAttribute("aria-expanded", o); };
document.addEventListener("click", () => { $("menu").hidden = true; });

function route() {
  const [, id, l] = location.hash.split("/");
  const inViewer = !!(id && l);
  $("list").hidden = inViewer; $("viewer").hidden = !inViewer;
  document.querySelector("header").hidden = inViewer; $("foot").hidden = inViewer;
  inViewer ? showViewer(decodeURIComponent(id), l) : showList();
}

$("menu").onclick = e => e.target.dataset.l && setLang(e.target.dataset.l);
addEventListener("hashchange", route);
function foot() {
  $("foot").innerHTML = `<a class="cta" href="${contactUrl(lang)}">${T[lang].ask}</a><div class="links"><a href="mailto:${CONTACT.mail}">${CONTACT.mail}</a><a href="tel:${CONTACT.tel}">${CONTACT.telText}</a><a href="${CONTACT.web}">${CONTACT.web.replace(/^https?:\/\//, "")}</a></div>`;
}
setLang(lang);
net();
</script>
</body>
</html>
